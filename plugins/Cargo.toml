[workspace]
resolver = "2"
# delay-gl-tests is a self-contained headless-GL harness (its own [workspace]);
# excluded so the Windows plugin build never resolves its EGL/gl deps.
exclude = ["delay-gl-tests"]
members = [
    "video-looper",
    "video-looper-ltm-dream",
    "delay-line-module",
    "delay-dsp",
    "delay-core",
    "pluglib",
    "delay-write",
    "delay-tap",
    "mirror-transform",
    "logistic-feedback",
    "channel-displace",
    "slew-limiter",
]

[workspace.dependencies]
ffgl-core = { path = "../vendor/ffgl-rs/ffgl-core" }
gl = "0.14.0"
gl_loader = "0.1.0"
tracing = { version = "0.1.40", features = ["log"] }

[profile.release]
debug = false
panic = "abort"
